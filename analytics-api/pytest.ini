[pytest]
# `-ra`: すべての「passed 以外」（xfail/xpass/error/skip）の理由サマリを最後に表示する。
#         現状は成功時に情報が出ず、CI ログから「なぜスキップ/失敗したか」を追いにくい。
# `--strict-markers`: 未登録の `@pytest.mark.xxx` を silent no-op ではなくエラーにする。
#         `slwo` のような typo で意図せずマーカが無効化される事故を防ぐ。
# `--strict-config`: `pytest.ini` / `pyproject.toml` の pytest 設定にある typo や
#         未対応キーをエラーにする。設定側のミスも silent に飲み込まない。
addopts = -ra --strict-markers --strict-config
