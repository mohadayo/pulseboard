name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ワークフロー全体のデフォルト権限を最小限 (contents: read) に制限する。
# 各ジョブはリポジトリのチェックアウト以外に GITHUB_TOKEN を利用しないため、
# 書き込み権限を持たせない。将来ジョブ単位で追加権限が必要になった場合は、
# そのジョブに `permissions:` を上書き宣言する運用とする。
# 参考: https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  contents: read

# 同一ワークフロー・同一 ref (PR ブランチや main) で新しいジョブが起動したら、
# 進行中の古いジョブをキャンセルする。PR に短時間で連続 push した場合の
# 実行枠・実行時間の無駄を削減する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analytics-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # pip の依存キャッシュを有効化。requirements-dev.txt のハッシュが
          # キャッシュキーになるため、依存追加/更新時のみキャッシュが再生成される。
          cache: pip
          cache-dependency-path: analytics-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 --max-line-length=120 --exclude=__pycache__ main.py
      - run: pytest -v

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: health-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test -v ./...

  test-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # npm の依存キャッシュを有効化。package-lock.json のハッシュが
          # キャッシュキーになるため、依存追加/更新時のみキャッシュが再生成される。
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      # tsconfig.json はテストファイル (`**/*.test.ts`) を build 対象から除外しているため、
      # `npm run build` 単独ではテストコードの型エラーを検出できない。ts-jest は
      # デフォルトでは isolated モジュール扱いで型検査を省略するケースがあり、
      # テストコードにひそむ型ミスマッチがすり抜けやすい。専用の
      # `tsconfig.typecheck.json` を使ってテストコードも含めた `tsc --noEmit` を
      # `npm test` の前段に噛ませることで、ランタイム前に型エラーで CI を落とす。
      - run: npm run type-check
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-python, test-go, test-typescript]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
