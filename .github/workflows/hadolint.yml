# Dockerfile 静的解析
#
# 目的:
#   3 サービス (analytics-api, api-gateway, health-checker) の Dockerfile を
#   hadolint で検査し、ベストプラクティス違反 (未 pin ベースイメージ、非効率な
#   RUN 分割、root 実行、レイヤ順序ミス等) を PR / push 時点で早期検知する。
#
# 設計上のポイント:
#   - hadolint は Docker image を pull する重量級 CLI ではなく、リリース済み
#     バイナリを直接実行する軽量ツール。`hadolint/hadolint-action` はこれを
#     ラップしただけで、実行時間は 1 ファイル数秒 (matrix 3 並列で合計数秒)。
#   - 3 サービス分を matrix で並列実行し、失敗した Dockerfile が特定しやすい
#     形で結果を出す。1 サービス失敗しても他は継続する (`fail-fast: false`)。
#   - 共有ポリシーは `.hadolint.yaml` に集約し、CI とローカル (`hadolint <path>`)
#     で同じ結果になるようにする。
#   - 権限は `contents: read` のみに限定、`concurrency` で同一 ref の多重実行を抑止。

name: hadolint

on:
  push:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '.hadolint.yaml'
      - '.github/workflows/hadolint.yml'
  pull_request:
    paths:
      - '**/Dockerfile'
      - '.hadolint.yaml'
      - '.github/workflows/hadolint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hadolint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: hadolint (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service:
          - analytics-api
          - api-gateway
          - health-checker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          config: .hadolint.yaml
          # デフォルトの `failure-threshold: info` は info レベルのメッセージでも
          # ワークフローを落とす。プロジェクトの粒度としては warning 以上を fail
          # 条件にし、info はレビュー時の判断材料として扱う。
          failure-threshold: warning
